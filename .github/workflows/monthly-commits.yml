name: Update monthly commit chart

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    paths:
      - '.github/workflows/monthly-commits.yml'
      - 'scripts/monthly-commits.py'

permissions:
  contents: write

concurrency:
  group: monthly-commit-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/monthly-commits.py
      - name: Save updated chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/monthly-commits.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly commit chart"
            git push
          fi
